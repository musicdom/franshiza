name: Norka checks

on:
  push:
    branches: [main, norka-rebuild]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript
        run: |
          node --check api/norka.js
          node --check api/norka-payment.js
          node --check api/yoomoney/notify.js
          node --check api/webhook.js
          node --check api/track-user.js
          node --check api/setup-webhook.js
          node --check api/cron/norka.js
          node --check lib/max-api.js
      - name: Check browser script syntax
        run: node tests/check-app.js
